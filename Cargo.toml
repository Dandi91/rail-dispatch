[package]
name = "rail-dispatch"
version = "0.2.0"
authors = ["Aleksandr Andreev <dandi.vlg@gmail.com>"]
edition = "2024"

[[bin]]
name = "rail-dispatch"
path = "src/main.rs"

[[bin]]
name = "map-editor"
path = "src/editor/main.rs"

[dependencies.bevy]
version = "0.20.0"
default-features = false
features = [
    "2d",
    "ui",
    "audio",
    "wav",
]

[dependencies]
itertools = "0.15.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.21"
toml = "1"
toml_edit = "0.25"
event-listener = "5.4.2"
futures-lite = "2.6.1"
thiserror = "2.0.21"
arrayvec = "0.7.8"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
# Skip debug info for dependencies: saves tens of GB in target/ and speeds up linking.
debug = false

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# BeautifulRust lints (https://github.com/morganlinton/BeautifulRust), adapted for a Bevy
# application: library-only lints (missing_docs, missing_*_doc, exhaustive_enums, print_*) are
# omitted, and Bevy's idiomatic system signatures are allowed. Make CI strict with
#     cargo clippy --all-targets -- -D warnings
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"      # Bevy: write Res<Time>, not Res<'_, Time>

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# Idioms.
string_add = "warn"
wildcard_imports = "warn"

# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"

# Casts that silently lose information.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are mostly noise in practice.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

# Bevy conventions (system parameters are taken by value; queries and systems are wide).
needless_pass_by_value = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
